name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inspect Apple build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodegen version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d OK4KiOS.xcodeproj

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project OK4KiOS.xcodeproj \
            -scheme OK4KiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_VERSION=5.9 \
            build | tee xcodebuild.log

      - name: Run iOS unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project OK4KiOS.xcodeproj \
            -scheme OK4KiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild-tests.log

      - name: Package TrollStore IPA
        run: |
          chmod +x Scripts/package-unsigned-ipa.sh
          Scripts/package-unsigned-ipa.sh \
            build/DerivedData/Build/Products/Release-iphoneos/OK4KiOS.app \
            OK4KiOS-TrollStore-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OK4KiOS-TrollStore-unsigned
          path: OK4KiOS-TrollStore-unsigned.ipa
